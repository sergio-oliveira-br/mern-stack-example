# k8s/backend-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: mern-backend

  template:
    metadata:
      labels:
        app: mern-backend

    spec:
      containers:
        - name: backend
          image: mern-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5050

          env:
            - name: ATLAS_URI
              valueFrom:
                secretKeyRef:
                  key: ATLAS_URI
                  name: mern-backend-secret

          readinessProbe:
            httpGet:
              port: 5050
              path: /health/ready